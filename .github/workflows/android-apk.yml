name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK and Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: Siri
        run: chmod +x ./gradlew

      - name: Build app and compile Android regression tests
        working-directory: Siri
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siri-android-debug-apk
          path: Siri/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
